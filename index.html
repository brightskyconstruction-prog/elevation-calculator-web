        <h1>Free Elevation &amp; Grade Calculator for Construction</h1>
        <p>A free, mobile-friendly elevation calculator built for construction workers, civil engineers, and surveyors. Calculate rod readings, compare heights between survey points, compute slope and grade percentages — all from your phone or tablet. No app download, no login, 100% free.</p>

        <h2>Key Features</h2>

          <li>Works offline — install as a PWA</li>
          <li>Supports feet/inches and engineering decimal formats</li>
        </ul>

        <h2>Who Uses This Tool</h2>
        <p>Construction crews use this elevation calculator on job sites to verify grades for drainage, pipe laying, road construction, and foundation work. Surveyors use it to record and compare benchmark elevations quickly without carrying paper. Civil engineering students use it to check differential leveling calculations.</p>

        <h2>How to Calculate Elevation Grade</h2>
        <p>To calculate elevation grade (slope percentage), divide the rise (difference in elevation between two points) by the run (horizontal distance), then multiply by 100. For example, if Point A is at elevation 100.50 ft and Point B is at 98.25 ft over a 50 ft horizontal distance, the grade is (100.50 − 98.25) / 50 × 100 = 4.5%. The Slope tab in this calculator does this automatically once you select your two survey points.</p>

        <h2>How to Read Survey Elevations</h2>
        <p>Survey elevations are measured in feet or meters above a datum (usually sea level or a local benchmark). A rod reading (also called a staff reading) is the value read on a leveling rod at a survey point. The derived elevation of a point is calculated as: HI (Height of Instrument) − Rod Reading = Derived Elevation, where HI = Benchmark Elevation + Backsight Rod Reading.</p>

    <!--
      Back-button guard — SYNCHRONOUS, runs before React loads.

      Doing this inside React's useEffect creates a ~50-100 ms gap between
      page load and listener registration. On Android Chrome a Back press
      during that window fires popstate with no handler and exits the app.

      By pushing guard entries and registering the listener here they are in
      place the instant the HTML is parsed — zero timing gap.

      React wires in the navigation logic via window.__elevHandleBack once it
      mounts. The Exit button sets window.__elevDead = true so subsequent Back
      presses navigate away naturally without re-showing the dialog.
    -->
    <script>
      (function () {
        var S = { _eac: 1 };
        var U = location.href;

        window.__elevDead = false;

        // Two guards: a rapid double-tap of Back would consume a single entry
        // before our popstate handler re-arms, letting the second tap exit.
        history.pushState(S, '', U);
        history.pushState(S, '', U);

        window.addEventListener('popstate', function () {
          if (window.__elevDead) return;   // user confirmed exit — let browser navigate away
          history.pushState(S, '', U);     // re-arm for the next Back press
          if (typeof window.__elevHandleBack === 'function') {
            window.__elevHandleBack();     // delegate all routing logic to React
          }
        });
      })();
    </script>
